name: Feasibility Spike — Endpoint & Data Source Validation

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - feature/scanner-upgrade

jobs:
  test-endpoints:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[spike]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SECRET_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt requests

      - name: Run Endpoint Feasibility Spike
        run: |
          python scripts/test_endpoints.py

      - name: Upload Feasibility Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-feasibility-report
          path: output/runner_feasibility_report.md
          retention-days: 7

      - name: Save runner results to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/runner_feasibility_report.md
          git diff --staged --quiet || git commit -m "chore: save runner feasibility report [skip ci]"
          git pull --rebase origin feature/scanner-upgrade || true
          git push origin feature/scanner-upgrade || true
