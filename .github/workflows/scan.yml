name: Insider Scanner — Scan & Outcome Tracking

permissions:
  contents: write

concurrency:
  group: scanner-data-sync-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    # 14:30 IST (09:00 UTC) — Optional Early Alert (Intraday scan)
    - cron: '0 9 * * 1-5'
    # 17:30 IST (12:00 UTC) — Main EOD Scan & Outcome Tracking (with UDDiP + MTO)
    - cron: '0 12 * * 1-5'
  push:
    branches:
      - feature/scanner-upgrade
    paths:
      - '.github/workflows/scan.yml'
      - 'scripts/**'
      - 'tracker.py'
      - 'holidays.py'
      - 'db.py'
      - 'main.py'
  workflow_dispatch:
    inputs:
      action:
        description: 'Workflow task to execute'
        required: true
        default: 'scan_and_track'
        type: choice
        options:
          - scan_and_track
          - track_only
          - squash_data_branch
      dry_run:
        description: 'Dry run mode (writes to throwaway data-test branch instead of data)'
        required: false
        type: boolean
        default: false
      enable_squash:
        description: 'Guard flag required to enable squash job (disabled by default)'
        required: false
        type: boolean
        default: false

jobs:
  scan_and_track:
    if: github.event.inputs.action != 'squash_data_branch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Record Job Start Time
        id: timing
        run: echo "start_epoch=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SECRET_TOKEN || github.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine Target Data Branch (Guard for Production Data)
        id: branch_target
        run: |
          # If triggered from feature branch, push, or dry_run=true, use throwaway data-test branch
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            TARGET_BRANCH="data"
          else
            TARGET_BRANCH="data-test"
          fi
          echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT
          echo "=========================================================="
          echo "Target Storage Branch: $TARGET_BRANCH"
          echo "=========================================================="

      - name: Restore Database from Target Storage Branch
        run: |
          TARGET="${{ steps.branch_target.outputs.target_branch }}"
          mkdir -p output
          if git fetch origin ${TARGET}:${TARGET} 2>/dev/null; then
            echo "Restoring scanner.db and exports from ${TARGET} branch..."
            git checkout ${TARGET} -- output/scanner.db output/scanner.sql output/unexplained_master.csv 2>/dev/null || true
          elif git fetch origin data:data 2>/dev/null; then
            echo "Seeding fresh ${TARGET} branch from production data branch..."
            git checkout data -- output/scanner.db output/scanner.sql output/unexplained_master.csv 2>/dev/null || true
          else
            echo "No existing data branch found. Initializing fresh DB."
          fi

      - name: Poll & Retry for EOD Bhavcopy Availability (17:30 IST Loop)
        run: |
          python -c "
          import time, requests, sys
          from datetime import datetime, timedelta
          headers = {'User-Agent': 'Mozilla/5.0'}
          today_str = datetime.now().strftime('%Y%m%d')
          url = f'https://archives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_{today_str}_F_0000.csv.zip'
          print(f'[Poll] Checking UDDiP Bhavcopy availability at {url}...')
          for attempt in range(1, 4):
              try:
                  r = requests.get(url, headers=headers, stream=True, timeout=5)
                  if r.status_code == 200:
                      print(f'[Poll] UDDiP Bhavcopy is AVAILABLE (HTTP 200, Last-Modified: {r.headers.get(\"Last-Modified\")})')
                      sys.exit(0)
                  print(f'[Poll] Attempt {attempt}: Received status {r.status_code}. Waiting 15s...')
              except Exception as e:
                  print(f'[Poll] Attempt {attempt} error: {e}')
              time.sleep(15)
          print('[Poll] Max retries reached. Pipeline will proceed with yfinance fallback gracefully.')
          "

      - name: Run Insider Scan
        if: github.event.inputs.action != 'track_only'
        run: python main.py

      - name: Run Outcome Tracker
        run: python main.py --track

      - name: Find Latest HTML Report
        id: find_report
        run: |
          REPORT=$(ls -t output/scan_*.html 2>/dev/null | head -1)
          echo "report_path=$REPORT" >> $GITHUB_OUTPUT
          echo "report_name=$(basename $REPORT)" >> $GITHUB_OUTPUT
          echo "Found report: $REPORT"

      - name: Email Scan Report
        if: steps.find_report.outputs.report_path != '' && env.GMAIL_ADDRESS != ''
        continue-on-error: true
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "📊 Insider Scan & Hit-Rate Report — ${{ github.event.repository.name }} — $(date -u +%Y-%m-%d)"
          body: |
            Hi,

            Today's insider activity scan & outcome tracking job has completed.
            Please find attached:
            - HTML scan & hit-rate report
            - Unexplained movers master CSV

            — Insider Scanner Bot 🤖
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.GMAIL_ADDRESS }}
          attachments: ${{ steps.find_report.outputs.report_path }},output/unexplained_master.csv

      - name: Upload Reports as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-report-${{ github.run_id }}
          path: output/
          retention-days: 30

      - name: Sync & Commit State to Target Branch
        run: |
          TARGET="${{ steps.branch_target.outputs.target_branch }}"
          echo "Syncing state to branch: ${TARGET}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/scanner_data
          cp output/scanner.db /tmp/scanner_data/ 2>/dev/null || true
          cp output/scanner.sql /tmp/scanner_data/ 2>/dev/null || true
          cp output/unexplained_master.csv /tmp/scanner_data/ 2>/dev/null || true

          # Checkout target data branch (creating orphan branch if it does not exist)
          if git fetch origin ${TARGET}:${TARGET} 2>/dev/null; then
            git checkout ${TARGET}
          else
            echo "Creating orphan branch ${TARGET}..."
            git checkout --orphan ${TARGET}
            git rm -rf . 2>/dev/null || true
          fi

          mkdir -p output
          cp /tmp/scanner_data/* output/ 2>/dev/null || true

          git add output/scanner.db output/scanner.sql output/unexplained_master.csv
          if git diff --staged --quiet; then
            echo "No changes to ${TARGET} branch to commit."
          else
            git commit -m "📊 Update scanner database, SQL dump, and exports [skip ci]"
            SUCCESS=0
            for attempt in 1 2 3; do
              echo "Push attempt $attempt to ${TARGET} branch..."
              if git pull --rebase origin ${TARGET} 2>/dev/null && git push origin ${TARGET}; then
                SUCCESS=1
                break
              elif git push origin ${TARGET}; then
                SUCCESS=1
                break
              fi
              sleep 5
            done
            if [ $SUCCESS -eq 0 ]; then
              echo "Failed to push to ${TARGET} branch after 3 attempts."
              exit 1
            fi
          fi

      - name: Log Execution Runtime
        if: always()
        run: |
          END_EPOCH=$(date +%s)
          START_EPOCH=${{ steps.timing.outputs.start_epoch }}
          RUNTIME=$((END_EPOCH - START_EPOCH))
          echo "=============================================="
          echo "Job Execution Runtime: ${RUNTIME} seconds"
          echo "=============================================="

  squash_data_branch:
    # Guards: Only runs on manual trigger, only if enable_squash=true, only against main ref
    if: github.event.inputs.action == 'squash_data_branch' && github.event.inputs.enable_squash == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SECRET_TOKEN || github.token }}
          fetch-depth: 0

      - name: Monthly Squash of data Branch (With Safety Backup Tag)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Guard check passed. Preparing squash for production 'data' branch..."
          git fetch origin data:data
          git checkout data

          # Step 1: Create safety backup tag before squashing
          BACKUP_TAG="backup-data-$(date -u +%Y%m%d%H%M%S)"
          echo "Creating safety backup tag: ${BACKUP_TAG}"
          git tag "${BACKUP_TAG}"
          git push origin "${BACKUP_TAG}"
          echo "✅ Backup tag ${BACKUP_TAG} pushed successfully."

          # Step 2: Create orphan squash commit
          git checkout --orphan temp-squash
          git add output/
          git commit -m "📦 Squash of scanner database history $(date -u +%Y-%m-%d) [skip ci]"

          # Step 3: Force push to data branch ONLY (allowed per architectural constraint)
          git push origin temp-squash:data --force
          echo "✅ Production data branch successfully squashed and force-pushed."
